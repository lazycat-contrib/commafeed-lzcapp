application:
  subdomain: commafeed
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://commafeed:8082/
services:
  commafeed:
    # athou/commafeed:7.1.0-h2-jvm
    # upstream: docker.io/athou/commafeed:7.3.1-h2-jvm
    image: registry.lazycat.cloud/czyt/athou/commafeed:f9723a343f4ffdc6
    binds:
      - /lzcapp/var/data:/commafeed/data
