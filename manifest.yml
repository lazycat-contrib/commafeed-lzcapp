application:
  subdomain: commafeed
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://commafeed:8082/
services:
  commafeed:
    # athou/commafeed:7.1.0-h2-jvm
    # upstream: docker.io/athou/commafeed:7.5.1-h2-jvm
    image: registry.lazycat.cloud/czyt/athou/commafeed:8c04b1e809b16a48
    binds:
      - /lzcapp/var/data:/commafeed/data
